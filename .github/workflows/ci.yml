name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (dipin rust-toolchain.toml: rustc 1.99.1)
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown
      - name: cargo test (near-sdk =5.29.1 + feature unit-testing)
        run: cargo test
      - name: cargo check wasm
        run: cargo check --target wasm32-unknown-unknown
